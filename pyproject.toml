[project]
name = "modsim"
version = "0.2.0"
description = "2D/3D sensor coverage modeling and simulation tool"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Robert Sivilli" }]
keywords = ["simulation", "sensor coverage", "swarm", "drones", "load testing", "locust", "zenoh", "rf", "sigmf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing :: Traffic Generation",
]
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "click>=8.0",
    "scipy>=1.17.0",
    "cartopy>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/rsivilli/swarmsim"
Repository = "https://github.com/rsivilli/swarmsim"
Issues = "https://github.com/rsivilli/swarmsim/issues"
Changelog = "https://github.com/rsivilli/swarmsim/blob/main/CHANGELOG.md"

[project.optional-dependencies]
loadtest = [
    "locust>=2.32",
    "eclipse-zenoh>=1.0",
    "pydantic-settings>=2.12",
]
udl = [
    "udl-sdk>=0.1.0a34",
]
rf = [
    "pyarrow>=17",
    "sigmf>=1.2",
]

[dependency-groups]
dev = [
    "pyarrow>=17",
    "pytest>=8.0",
    "ruff>=0.15",
    "sigmf>=1.2",
]

[project.scripts]
modsim = "modsim.cli_entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modsim"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit so newer ruff releases with broader defaults don't change CI results
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
