[project]
name = "modsim"
version = "0.2.0"
description = "2D/3D sensor coverage modeling and simulation tool"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "click>=8.0",
    "scipy>=1.17.0",
    "cartopy>=0.25.0",
]

[project.optional-dependencies]
loadtest = [
    "locust>=2.32",
    "eclipse-zenoh>=1.0",
    "pydantic-settings>=2.12",
]
udl = [
    "udl-sdk>=0.1.0a34",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.15"]

[project.scripts]
modsim = "modsim.cli_entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modsim"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["sample_output"]

[tool.ruff.lint]
# Explicit so newer ruff releases with broader defaults don't change CI results
select = ["E4", "E7", "E9", "F"]
