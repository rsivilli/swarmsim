name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: Validate bundled scenarios
        run: |
          for f in scenarios/*.yaml; do uv run modsim validate "$f"; done

  loadtest-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Lint Helm chart
        run: helm lint locust/helm-chart --set timeline.existingConfigMap=locust-timeline
      - name: Render Helm chart with each timeline source
        run: |
          helm template t locust/helm-chart --set timeline.existingConfigMap=locust-timeline \
            | grep -q 'name: locust-timeline'
          helm template t locust/helm-chart --set timeline.inline=x \
            | grep -q 'name: t-modsim-locust-timeline'
          helm template t locust/helm-chart --set timeline.hostPath=/data/timelines \
            | grep -q 'path: /data/timelines'
      - name: Build Locust image
        run: docker build -t modsim-locust:ci locust/
