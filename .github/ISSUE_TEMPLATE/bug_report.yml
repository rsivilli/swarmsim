name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Include any error output.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The command you ran and, if possible, the scenario YAML (or the name of a bundled scenario).
      render: shell
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: "Output of `modsim version`"
      render: text
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Simulation / detection
        - Visualization / animation
        - Comms export / Helm values
        - Locust / Docker / Helm chart
        - Other
    validations:
      required: true
