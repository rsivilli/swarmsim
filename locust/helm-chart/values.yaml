image:
  repository: modsim-locust
  tag: latest
  pullPolicy: IfNotPresent

locust:
  master:
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  worker:
    replicas: 5
    resources:
      requests:
        cpu: 1000m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi

# Transport configuration
transport:
  # "rest" | "native" | "udl"
  mode: rest
  # Native Zenoh router endpoint (only for mode: native)
  zenohRouter: "tcp/localhost:7447"

# UDL credentials (create a Secret named "udl-credentials" with these keys)
udl:
  secretName: udl-credentials
  baseUrl: ""  # required for mode: udl
  classification: ""  # required for mode: udl

# Timeline configuration. Set exactly one source; hostPath wins, then
# existingConfigMap, then inline. With none set, pods start with an empty /data.
timeline:
  # Path inside the container where timeline is mounted. The file name must match
  # the key in the ConfigMap (e.g. /data/timeline.json -> key "timeline.json").
  path: /data/timeline.jsonl
  # Option 1: Mount a ConfigMap you created yourself (< 1MiB), e.g.
  #   kubectl create configmap locust-timeline --from-file=timeline.jsonl=output/run_comms.jsonl
  existingConfigMap: ""
  # Option 2: Embed small timeline in a chart-managed ConfigMap (< 1MiB)
  inline: ""
  # Option 3: HostPath mount for large files (Kind/local dev)
  hostPath: ""

# Backend configuration (used for REST transport --host flag)
backend:
  host: "http://backend-service.default.svc.cluster.local:8080"

# Test configuration
test:
  users: 51
  spawnRate: 5
  runTime: 59m
  headless: false

service:
  type: ClusterIP
  port: 8089
