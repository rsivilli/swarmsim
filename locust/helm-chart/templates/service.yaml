apiVersion: v1
kind: Service
metadata:
  name: {{ include "modsim-locust.fullname" . }}-master
  labels:
    {{- include "modsim-locust.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: web
    protocol: TCP
    name: web
  - port: 5557
    targetPort: master
    protocol: TCP
    name: master
  selector:
    {{- include "modsim-locust.selectorLabels" . | nindent 4 }}
    component: master
