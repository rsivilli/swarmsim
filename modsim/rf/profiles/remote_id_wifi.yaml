id: remote_id_wifi
description: Broadcast Remote ID over Wi-Fi beacon frames (ASTM F3411)
waveform: ofdm
bandwidth_hz: 20000000
power_dbm: 15
antenna_gain_dbi: 0
roles: [drone]
channels_mhz: [2412, 2437, 2462]
channel_names: ["1", "6", "11"]
activity:
  - model: beacon
    params:
      interval_s: 0.5
      burst_s: 0.0005
      jitter_s: 0.002
      sequence: one
      channel: "6"
waveform_params: {standard: wifi, modulation: bpsk}
signal: {type: digital, standard: ASTM F3411 (Wi-Fi beacon), carrier_variant: multi_carrier, multiplexing: ofdm}
calibration: provisional
sources:
  - ASTM F3411 Remote ID broadcast requirements
  - IEEE 802.11 beacon frame timing
