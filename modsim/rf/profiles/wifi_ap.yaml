id: wifi_ap
description: Background Wi-Fi access point (beacons plus light client traffic) on channel 1, 6 or 11
waveform: ofdm
bandwidth_hz: 20000000
power_dbm: 18
antenna_gain_dbi: 2
roles: [background]
channels_mhz: [2412, 2437, 2462]
channel_names: ["1", "6", "11"]
activity:
  - model: beacon
    params:
      interval_s: 0.1024
      burst_s: 0.0004
      jitter_s: 0.0
      sequence: one
      channel: random
  - model: csma_traffic
    params:
      offered_load: 0.05
      frame_s: [0.0001, 0.0015]
      channel: random
signal: {type: digital, standard: "802.11", carrier_variant: multi_carrier, multiplexing: ofdm}
calibration: provisional
sources:
  - IEEE 802.11 (beacon interval 102.4 ms, channelization)
