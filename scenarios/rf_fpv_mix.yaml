name: "RF mix — FPV, DJI and silent drones vs four RF sensors"
# RF example: `modsim rf scenarios/rf_fpv_mix.yaml --dry-run`, or synthesize a short window:
# `modsim rf scenarios/rf_fpv_mix.yaml --window 0:2 --sensors RF-01,RF-04`
area:
  width_km: 10.0
  height_km: 10.0
dt: 0.5
duration: 60
seed: 7

reference_origin:
  - 38.8353
  - -104.8216

detection:
  mode: binary
  range: 3.0

groups:
  - group_id: fpv
    count: 6
    mode: swarm
    heading: [1.0, 0.2]
    speed_min: 0.025
    speed_max: 0.035
    spawn_center: [1.5, 3.0]
    spawn_radius: 0.4
    spacing_profile: random
    spawn_altitude: 0.08
    spawn_altitude_range: 0.03
    rf:
      links:
        - profile: elrs_900
          params: {packet_rate_hz: 150}
        - profile: analog_fpv
          params: {channel: R5, power_dbm: 25}
      controller:
        placement: per_group
        offset_from_spawn: [-0.8, -0.5]
        altitude_m: 1.5
        links:
          - profile: elrs_900
            params: {packet_rate_hz: 150}

  - group_id: dji
    count: 3
    mode: formation
    heading: [0.3, 1.0]
    speed: 0.012
    spawn_center: [6.0, 1.5]
    spawn_radius: 0.3
    spacing_profile: uniform
    spawn_altitude: 0.12
    rf:
      links:
        - profile: dji_ocusync_dl
          params: {bandwidth_mhz: 20}
        - profile: dji_droneid
        - profile: remote_id_ble
      controller:
        placement: per_drone
        offset_from_spawn: [0.0, -0.3]
        links:
          - profile: dji_ocusync_ul

  - group_id: autonomous
    count: 5
    mode: formation
    heading: [-1.0, 0.0]
    speed: 0.04
    spawn_center: [9.5, 7.5]
    spawn_radius: 0.5
    spacing_profile: uniform
    spawn_altitude: 0.2
    rf:
      links:
        - profile: silent

rf:
  epoch: "2026-01-01T00:00:00Z"
  cull_snr_db: -15
  annotations:
    granularity: dwell
  background:
    - profile: wifi_ap
      density_per_km2: 1.0
      altitude_m: [3, 12]
    - profile: ble_device
      density_per_km2: 5.0
      altitude_m: [1, 3]

rf_sensors:
  - id: RF-01
    position: [4.0, 4.0, 0.010]
    type: detect
    receiver: {noise_figure_db: 6, sample_format: ci16_le, adc_bits: 14, antenna_gain_dbi: 2}
    tuning:
      mode: fixed
      bands:
        - {name: ism915, center_hz: 915.0e6, sample_rate: 30.0e6}
    detector: {threshold_snr_db: 6}

  - id: RF-02
    position: [6.0, 5.0, 0.015]
    type: df
    array: {geometry: uca, elements: 4, radius_m: 0.08, element_gain_dbi: 3}
    receiver: {noise_figure_db: 7, sample_format: ci16_le, adc_bits: 12}
    tuning:
      mode: multi
      bands:
        - {name: ism2g4, center_hz: 2.442e9, sample_rate: 100.0e6}
        - {name: ism5g8, center_hz: 5.795e9, sample_rate: 200.0e6}
    detector: {threshold_snr_db: 8}

  - id: RF-03
    position: [2.0, 7.0, 0.020]
    type: detect
    receiver: {noise_figure_db: 5, sample_format: cf32_le}
    tuning:
      mode: scanning
      bands:
        - {name: ism915, center_hz: 915.0e6, sample_rate: 100.0e6}
        - {name: ism2g4, center_hz: 2.442e9, sample_rate: 100.0e6}
        - {name: ism5g8, center_hz: 5.795e9, sample_rate: 100.0e6}
      dwell_ms: 50
      retune_ms: 1
    detector: {threshold_snr_db: 6}

  - id: RF-04
    position: [3.0, 3.5, 0.008]
    type: detect
    receiver: {noise_figure_db: 6, sample_format: ci16_le, adc_bits: 12, antenna_gain_dbi: 3}
    tuning:
      mode: multi
      bands:
        - {name: fpv_r5, center_hz: 5.806e9, sample_rate: 40.0e6}
        - {name: ism2g4, center_hz: 2.442e9, sample_rate: 100.0e6}
    detector: {threshold_snr_db: 6}
