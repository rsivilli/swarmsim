name: "EU Drone Wall \u2014 border sensor network vs cross-border penetration"
area:
  width_km: 100.0
  height_km: 40.0
dt: 10
duration: 2400
seed: 2027

# Geographic reference point (Russia-Ukraine border region)
reference_origin:
  - 52.7  # latitude (52°42'00.0"N)
  - 23.8  # longitude (23°48'00.0"E)

detection:
  mode: probabilistic
  range: 7.0
  pd_function: exponential
  pd_half_range: 5.0
groups:
- group_id: low_slow
  count: 300
  mode: swarm
  heading:
  - -0.7
  - -0.7
  speed_min: 0.02
  speed_max: 0.04
  spawn_center:
  - 50.0
  - 39.5
  spawn_radius: 20.0
  spacing_profile: random
  spawn_altitude: 0.080
  spawn_altitude_range: 0.060
- group_id: fast_dash
  count: 100
  mode: swarm
  heading:
  - -0.8
  - -0.6
  speed_min: 0.055
  speed_max: 0.07
  spawn_center:
  - 30.0
  - 39.5
  spawn_radius: 5.0
  spacing_profile: gaussian
  spawn_altitude: 0.300
  spawn_altitude_range: 0.150
