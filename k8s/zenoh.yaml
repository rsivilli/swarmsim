apiVersion: v1
kind: Namespace
metadata:
  name: zenoh
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zenoh-config
  namespace: zenoh
data:
  zenoh.json5: |
    {
      mode: "router",
      listen: {
        endpoints: ["tcp/[::]:7447"],
      },
      plugins: {
        rest: {
          http_port: 8000,
        },
        storage_manager: {
          volumes: {
            memory: {}
          },
          storages: {
            tracks: {
              key_expr: "tracks/**",
              volume: "memory",
            }
          }
        },
      },
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenoh-router
  namespace: zenoh
  labels:
    app: zenoh-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zenoh-router
  template:
    metadata:
      labels:
        app: zenoh-router
    spec:
      containers:
      - name: zenoh
        image: eclipse/zenoh:1.7.2
        args: ["-c", "/config/zenoh.json5"]
        ports:
        - containerPort: 7447
          name: zenoh
          protocol: TCP
        - containerPort: 8000
          name: rest
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: zenoh-config
---
apiVersion: v1
kind: Service
metadata:
  name: zenoh-router
  namespace: zenoh
  labels:
    app: zenoh-router
spec:
  type: NodePort
  selector:
    app: zenoh-router
  ports:
  - name: rest
    port: 8000
    targetPort: 8000
    nodePort: 30800
  - name: zenoh
    port: 7447
    targetPort: 7447
    nodePort: 30747
